name: otobanana-record

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      live_id:
        description: 'livestream post id (empty = auto detect)'
        required: false
        default: ''

concurrency:
  group: otobanana-record
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      live_id: ${{ steps.detect.outputs.live_id }}
      title: ${{ steps.detect.outputs.title }}
      avatar: ${{ steps.detect.outputs.avatar }}
    steps:
      - id: detect
        run: |
          set -e
          USER_ID=a28c1be1-bb11-43fc-935a-c6c85bbb40e7
          AVATAR=$(curl -s --max-time 30 "https://api.v2.otobanana.com/api/users/$USER_ID/" | jq -r '.avatar_url // empty')
          ID="${{ github.event.inputs.live_id }}"
          if [ -z "$ID" ]; then
            RESP=$(curl -s --max-time 30 "https://api.v2.otobanana.com/api/users/$USER_ID/livestreams/?is_adult=1")
            ID=$(echo "$RESP" | jq -r '[.data[] | select(.is_open == true)][0].post.id // empty')
            TITLE=$(echo "$RESP" | jq -r '[.data[] | select(.is_open == true)][0].post.title // empty')
          else
            TITLE="manual"
          fi
          echo "live_id=$ID" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "avatar=$AVATAR" >> $GITHUB_OUTPUT
          echo "detected live_id=$ID title=$TITLE avatar=$AVATAR"

  record:
    needs: check
    if: needs.check.outputs.live_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-Linux-v1
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Record
        env:
          LIVE_ID: ${{ needs.check.outputs.live_id }}
          OTO_COOKIES: ${{ secrets.OTO_COOKIES }}
          OUT_DIR: out
          TITLE: ${{ needs.check.outputs.title }}
        run: node record.js

      - name: Convert audio and video
        if: always()
        env:
          AVATAR: ${{ needs.check.outputs.avatar }}
        run: |
          rm -rf out/video || true
          ls -la out || true
          if ls out/part_*.webm >/dev/null 2>&1; then
            cat $(ls out/part_*.webm | sort) > out/all.webm
            ffmpeg -y -i out/all.webm -vn -c:a aac -b:a 192k "out/recording.m4a" || true
          fi
          if [ -s out/screen.webm ] && [ -s out/recording.m4a ]; then
            echo "merge screen video + audio"
            ffmpeg -y -i out/screen.webm -i out/recording.m4a \
              -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
              -c:a copy -shortest "out/recording_with_chat.mp4" || true
          fi
          if [ -s out/recording.m4a ] && [ ! -s out/recording_with_chat.mp4 ]; then
            curl -sL --max-time 30 "$AVATAR" -o out/cover.png || true
            if [ -s out/cover.png ]; then
              ffmpeg -y -loop 1 -framerate 1 -i out/cover.png -i out/recording.m4a \
                -vf "scale=1080:1080:force_original_aspect_ratio=decrease,pad=1080:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -c:v libx264 -tune stillimage -pix_fmt yuv420p -c:a copy -shortest "out/recording.mp4" || true
            else
              ffmpeg -y -f lavfi -i color=c=black:s=1080x1080:r=1 -i out/recording.m4a \
                -c:v libx264 -tune stillimage -pix_fmt yuv420p -c:a copy -shortest "out/recording.mp4" || true
            fi
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ needs.check.outputs.live_id }}-${{ github.run_id }}
          path: out
          retention-days: 30
          if-no-files-found: warn
