name: otobanana-record

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      live_id:
        description: 'livestream post id (empty = auto detect)'
        required: false
        default: ''

concurrency:
  group: otobanana-record
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      live_id: ${{ steps.detect.outputs.live_id }}
      title: ${{ steps.detect.outputs.title }}
      avatar: ${{ steps.detect.outputs.avatar }}
    steps:
      - id: detect
        run: |
          set -e
          USER_ID=a28c1be1-bb11-43fc-935a-c6c85bbb40e7
          AVATAR=$(curl -s --max-time 30 "https://api.v2.otobanana.com/api/users/$USER_ID/" | jq -r '.avatar_url // empty')
          ID="${{ github.event.inputs.live_id }}"
          if [ -z "$ID" ]; then
            RESP=$(curl -s --max-time 30 "https://api.v2.otobanana.com/api/users/$USER_ID/livestreams/?is_adult=1")
            ID=$(echo "$RESP" | jq -r '[.data[] | select(.is_open == true)][0].post.id // empty')
            TITLE=$(echo "$RESP" | jq -r '[.data[] | select(.is_open == true)][0].post.title // empty')
          else
            TITLE="manual"
          fi
          echo "live_id=$ID" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "avatar=$AVATAR" >> $GITHUB_OUTPUT
          echo "detected live_id=$ID title=$TITLE avatar=$AVATAR"

  record:
    needs: check
    if: needs.check.outputs.live_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-Linux-v1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Record
        env:
          LIVE_ID: ${{ needs.check.outputs.live_id }}
          OTO_COOKIES: ${{ secrets.OTO_COOKIES }}
          OUT_DIR: out
          TITLE: ${{ needs.check.outputs.title }}
        run: |
          mkdir -p out
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR && chmod 700 $XDG_RUNTIME_DIR
          sudo apt-get install -y pulseaudio pulseaudio-utils >/dev/null 2>&1 || true
          pulseaudio -D --exit-idle-time=-1 --log-target=file:/tmp/pulse.log || true
          sleep 3
          pactl load-module module-null-sink sink_name=vsink rate=48000 channels=2 || true
          pactl set-default-sink vsink || true
          pactl info || true
          echo "--- start system audio capture (parec) ---"
          (parec -d vsink.monitor --format=s16le --rate=48000 --channels=2 --file-format=raw > out/audio.pcm 2> out/parec.err) &
          PAREC_PID=$!
          echo "parec pid=$PAREC_PID"
          node record.js || echo "record.js exited non-zero"
          sleep 3
          kill $PAREC_PID 2>/dev/null || true
          sleep 2
          echo "--- pcm size ---"
          ls -la out/audio.pcm || true
          head -c 200 out/parec.err || true
          ls -la out

      - name: Convert audio and video
        if: always()
        env:
          AVATAR: ${{ needs.check.outputs.avatar }}
        run: |
          rm -rf out/video || true
          ls -la out || true
          AUDIO=""
          if [ -s out/audio.pcm ]; then
            echo "convert system capture (parec)"
            ffmpeg -y -f s16le -ar 48000 -ac 2 -i out/audio.pcm -c:a aac -b:a 192k "out/system.m4a" || true
            if [ -s out/system.m4a ]; then AUDIO="out/system.m4a"; echo "audio source: system"; fi
          fi
          if [ -z "$AUDIO" ] && ls out/part_*.webm >/dev/null 2>&1; then
            echo "convert page capture (mediarecorder)"
            cat $(ls out/part_*.webm | sort) > out/all.webm
            ffmpeg -y -i out/all.webm -vn -c:a aac -b:a 192k "out/recording.m4a" || true
            if [ -s out/recording.m4a ]; then AUDIO="out/recording.m4a"; echo "audio source: page"; fi
          fi
          if [ -n "$AUDIO" ] && [ -s out/screen.webm ]; then
            echo "merge screen video + audio ($AUDIO)"
            ffmpeg -y -i out/screen.webm -i "$AUDIO" \
              -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
              -c:a copy -shortest "out/recording_with_chat.mp4" || true
          fi
          if [ -n "$AUDIO" ] && [ ! -s out/recording_with_chat.mp4 ]; then
            curl -sL --max-time 30 "$AVATAR" -o out/cover.png || true
            if [ -s out/cover.png ]; then
              ffmpeg -y -loop 1 -framerate 1 -i out/cover.png -i "$AUDIO" \
                -vf "scale=1080:1080:force_original_aspect_ratio=decrease,pad=1080:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
                -c:v libx264 -tune stillimage -pix_fmt yuv420p -c:a copy -shortest "out/recording.mp4" || true
            else
              ffmpeg -y -f lavfi -i color=c=black:s=1080x1080:r=1 -i "$AUDIO" \
                -c:v libx264 -tune stillimage -pix_fmt yuv420p -c:a copy -shortest "out/recording.mp4" || true
            fi
          fi
          ls -la out

      - name: Drop silent result
        if: always()
        run: |
          CAND=""
          for f in out/recording_with_chat.mp4 out/system.m4a out/recording.m4a out/recording.mp4; do
            if [ -s "$f" ]; then CAND="$f"; break; fi
          done
          if [ -z "$CAND" ]; then
            echo "::error::no audio recorded at all, nothing to keep"
            rm -rf out/*
            exit 1
          fi
          MV=$(ffmpeg -hide_banner -i "$CAND" -af volumedetect -f null - 2>&1 | grep -o 'mean_volume: [-0-9.]*' | head -1 | grep -o '[-0-9.]*$')
          echo "checked=$CAND mean_volume=$MV"
          if [ -z "$MV" ]; then
            echo "::error::cannot measure volume, drop"
            rm -rf out/*
            exit 1
          fi
          VERDICT=$(awk -v v="$MV" 'BEGIN{ if (v+0 < -80) print "silent"; else print "ok" }')
          echo "verdict=$VERDICT"
          if [ "$VERDICT" = "silent" ]; then
            echo "::error::recording is silent ($MV dB), dropping per user requirement"
            rm -rf out/*
            exit 1
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: live-${{ needs.check.outputs.live_id }}-${{ github.run_id }}
          path: out
          retention-days: 30
          if-no-files-found: warn
