name: test-audio

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-Linux-v1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test system audio capture
        run: |
          mkdir -p out
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p $XDG_RUNTIME_DIR && chmod 700 $XDG_RUNTIME_DIR
          pulseaudio -D --exit-idle-time=-1 --log-target=file:/tmp/pulse.log || true
          sleep 3
          pactl load-module module-null-sink sink_name=vsink rate=48000 channels=2 || true
          pactl set-default-sink vsink || true
          pactl info || true
          (parec -d vsink.monitor --format=s16le --rate=48000 --channels=2 --file-format=raw > out/audio.pcm 2> out/parec.err) &
          PAREC=$!
          node test-audio.js
          sleep 2
          kill $PAREC 2>/dev/null || true
          sleep 2
          ls -la out
          echo "--- parec.err ---"
          head -c 300 out/parec.err || true
          echo "--- volume of system capture ---"
          ffmpeg -hide_banner -f s16le -ar 48000 -ac 2 -i out/audio.pcm -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume' || echo "no pcm"
